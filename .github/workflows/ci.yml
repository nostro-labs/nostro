name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nostro
          POSTGRES_PASSWORD: nostro
          POSTGRES_DB: nostro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nostro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      NOSTRO_TEST_DATABASE_URL: postgres://nostro:nostro@localhost:5432/nostro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm test
