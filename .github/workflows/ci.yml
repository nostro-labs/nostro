name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nostro
          POSTGRES_PASSWORD: nostro
          POSTGRES_DB: nostro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nostro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      NOSTRO_TEST_DATABASE_URL: postgres://nostro:nostro@localhost:5432/nostro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nostro:ci .
      - name: Migrate, serve and stop cleanly
        run: |
          docker volume create nostro-ci
          docker run --rm -v nostro-ci:/data nostro:ci migrate
          docker run -d --name nostro-ci -v nostro-ci:/data -p 127.0.0.1:8080:8080 \
            -e NOSTRO_API_KEYS="ci:$(openssl rand -hex 32)" nostro:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/v1/health && break; sleep 1; done
          curl -sf localhost:8080/v1/openapi.json > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/movements)" = 401
          docker stop -t 10 nostro-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' nostro-ci)" = 0
          docker logs nostro-ci | grep -q '^Stopped\.$'
